    <button class="nav-item active" aria-current="page"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3 8-8"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg><span>검토함</span><span class="badge num" id="navBadge">5</span></button>
    <button class="nav-item"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg><span>검색</span></button>
    <div class="nav-sep"></div>
    <button class="nav-item"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-2.82 1.17V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15H4.5a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 6 9.4"/></svg><span>설정</span></button>
    <div class="rail-foot">본인 1인 · Dynamic<br>Plan v0.2 · Design Draft</div>

  <header class="topbar">
    <div class="search"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg><input type="text" placeholder="프로젝트·회의록·할 일 검색" aria-label="검색"></div>
    <div class="cost-chip" title="이번 청구 주기 확정+예약 / 유료 대기선 24,000원"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg><span class="num">₩16,903 / 24,000</span></div>
    <button class="icon-btn" id="themeBtn" aria-label="테마 전환" title="라이트/다크 전환"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
    <div class="avatar" title="worksuhyeon">S</div>
  </header>

  <main class="main">
    <div class="page-head">
      <div class="greet">꼼꼼히 살펴봐요</div>
      <h1>검토함</h1>
      <div class="sub">AI가 제안한 변경을 확정 상태에 반영하려면 승인하세요 · 오늘 못 하면 미뤄둘 수 있어요</div>
    </div>

    <div class="toolbar">
      <div class="tabs" id="tabs">
        <button class="on" data-t="today">오늘 <span class="num" data-c="today"></span></button>
        <button data-t="snoozed">미룬 항목 <span class="num" data-c="snoozed"></span></button>
        <button data-t="done">처리됨 <span class="num" data-c="done"></span></button>
      </div>
      <label class="selall"><input type="checkbox" id="selAll" style="width:17px;height:17px;accent-color:var(--primary)"> 선택 가능 전체</label>
      <div class="spacer"></div>
      <span class="selinfo" id="selInfo">선택 0건</span>
      <button class="btn primary" id="batchBtn" disabled>선택 승인</button>
    </div>

    <div class="review-grid">
      <section class="list" id="list" aria-label="제안 목록"></section>
      <section class="detail" id="detail" aria-label="제안 상세"></section>
    </div>
  </main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
  "use strict";
  var TODAY = new Date(2026,9,17); // 2026-10-17 (금)
  function fmt(d){ return (d.getMonth()+1)+"/"+d.getDate(); }
  function addDays(base,n){ var d=new Date(base); d.setDate(d.getDate()+n); return d; }

  // ===== 제안 데이터 (합성) =====
  var proposals = [
    { id:"p1", kind:"status", sev:"high", project:"브랜드 리뉴얼", title:"프로젝트 상태 변경 제안",
      review:"need", status:"pending", snoozedUntil:null,
      target:"브랜드 리뉴얼 · 프로젝트 상태",
      diff:[{k:"상태", b:"진행 중", a:"검토 대기"}],
      evidence:{ quote:"“이번 주 안에 시안 확정하고 바로 리뷰 들어가자”", source:"10/16 주간회의 · 02:14 구간", origin:"진행 중", at:"10/16 21:03", expire:"음성 11/15 만료" },
      note:"상태 전환이라 일괄 승인 대상이 아닙니다. 승인하면 근거·작성 주체·전후 버전과 함께 이력에 기록됩니다." },

    { id:"p2", kind:"status", sev:"mid", project:"로고 시안 2차", title:"할 일 기한 변경 제안",
      review:"need", status:"pending", snoozedUntil:null,
      target:"로고 시안 2차 · 마감일",
      diff:[{k:"기한", b:"10/20 (월)", a:"10/24 (금)"}],
      evidence:{ quote:"“로고 시안은 다음 주 금요일까지 미루고, 그 전엔 콘셉트만 잡자”", source:"10/16 주간회의 · 05:41 구간", origin:"10/20", at:"10/16 21:03", expire:"음성 11/15 만료" },
      note:"기한 변경도 상세 확인 후 개별 적용됩니다. 날짜만 지정된 기한은 날짜 그대로 보존됩니다." },

    { id:"p3", kind:"task", sev:"low", project:"브랜드 리뉴얼", title:"새 할 일 3건 제안",
      review:"ok", status:"pending", snoozedUntil:null,
      target:"브랜드 리뉴얼 · 새 할 일",
      tasks:["촬영 일정 확정","상세페이지 카피 초안","촬영 예산 재확인"],
      evidence:{ quote:"“촬영 일정이랑 예산 다시 보고, 카피도 초안부터 잡아줘”", source:"10/16 주간회의 · 08:20 구간", origin:"-", at:"10/16 21:03", expire:"음성 11/15 만료" },
      note:"담당자·기한이 명시되지 않아 미지정으로 둡니다. 임의 확정하지 않습니다. 일괄 승인 가능 항목입니다." },

    { id:"p4", kind:"status", sev:"high", project:"3분기 운영 리포트", title:"프로젝트 상태 변경 제안",
      review:"conflict", status:"pending", snoozedUntil:null,
      target:"3분기 운영 리포트 · 프로젝트 상태",
      diff:[{k:"상태", b:"주의", a:"진행 중"}],
      evidence:{ quote:"“데이터 들어왔으니까 이제 정상 진행으로 봐도 될 듯”", source:"10/16 데일리 · 01:02 구간", origin:"주의", at:"10/16 21:05", expire:"음성 11/15 만료" },
      conflict:"다른 기기(웹)에서 방금 이 프로젝트 상태를 직접 변경했습니다. 제안의 기준 버전과 현재 최신 상태가 다릅니다.",
      note:"최신 상태와 다시 비교한 뒤에만 승인할 수 있습니다." },

    { id:"p5", kind:"task", sev:"mid", project:"모바일 앱 출시", title:"할 일 기한 변경 제안",
      review:"blocked", status:"pending", snoozedUntil:null,
      target:"모바일 앱 출시 · ‘심사 제출’ 기한",
      diff:[{k:"기한", b:"10/25", a:"10/28"}],
      evidence:{ quote:"(근거 전사 구간이 삭제됨)", source:"삭제된 기록", origin:"10/25", at:"10/16 20:40", expire:"근거 삭제됨" },
      blocked:"이 제안의 근거가 된 전사 구간이 삭제되었습니다. 새 근거가 없으면 승인할 수 없습니다.",
      note:"원본 삭제 시 파생 제안은 재검토 대상으로 격리됩니다." }
  ];

  var tab = "today", selectedId = "p1", picked = {}, editing = false, snoozeOpen = false;

  function esc(s){return String(s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
  function sevName(s){return s==="high"?"높음":s==="mid"?"보통":"낮음";}
  function selectable(p){ return p.status==="pending" && !p.snoozedUntil && p.review==="ok"; }

  function inTab(p){
    if(tab==="today")   return p.status==="pending" && !p.snoozedUntil;
    if(tab==="snoozed") return p.status==="pending" && !!p.snoozedUntil;
    if(tab==="done")    return p.status==="approved" || p.status==="rejected" || p.status==="discarded";
    return true;
  }
  function counts(){
    return {
      today: proposals.filter(function(p){return p.status==="pending"&&!p.snoozedUntil;}).length,
      snoozed: proposals.filter(function(p){return p.status==="pending"&&!!p.snoozedUntil;}).length,
      done: proposals.filter(function(p){return p.status!=="pending";}).length
    };
  }
  function stateBadge(p){
    if(p.status==="approved") return '<span class="state-badge sb-approved">승인됨</span>';
    if(p.status==="rejected") return '<span class="state-badge sb-rejected">거절됨</span>';
    if(p.status==="discarded")return '<span class="state-badge sb-rejected">폐기됨</span>';
    if(p.snoozedUntil)        return '<span class="state-badge sb-snooze">미룸 '+fmt(p.snoozedUntil)+'</span>';
    if(p.review==="conflict") return '<span class="state-badge sb-conflict">충돌</span>';
    if(p.review==="blocked")  return '<span class="state-badge sb-blocked">차단</span>';
    if(p.review==="need")     return '<span class="state-badge sb-need">상세 확인</span>';
    return "";
  }
  function miniDiff(p){
    if(p.tasks) return '<span class="tag">할 일 '+p.tasks.length+'건</span>';
    var d=p.diff[0]; return '<span class="chip-b">'+esc(d.b)+'</span><span class="arrow">→</span><span class="chip-a">'+esc(d.a)+'</span>';
  }

  function renderTabs(){
    var c = counts();
    document.querySelectorAll("#tabs [data-c]").forEach(function(el){ el.textContent = c[el.dataset.c]; });
    document.getElementById("navBadge").textContent = c.today + c.snoozed;
  }

  function renderList(){
    var list = document.getElementById("list");
    var items = proposals.filter(inTab);
    if(items.length===0){
      var msg = tab==="snoozed" ? "미뤄둔 제안이 없습니다." : tab==="done" ? "오늘 처리한 제안이 없습니다." : "오늘 검토할 제안이 없습니다.";
      list.innerHTML = '<div style="color:var(--muted);font-size:14px;padding:16px">'+msg+'</div>'; return;
    }
    list.innerHTML = items.map(function(p){
      var done = p.status!=="pending";
      return '<article class="rcard sev-'+p.sev+(done?' done':'')+(p.id===selectedId?' selected':'')+'" data-id="'+p.id+'" tabindex="0">'+
        (selectable(p) ? '<input type="checkbox" class="rcheck" data-pick="'+p.id+'" '+(picked[p.id]?'checked':'')+' aria-label="선택">'
                       : '<span style="width:18px;flex:none"></span>')+
        '<div class="rbody"><div class="rtop"><span class="rtitle">'+esc(p.title)+'</span>'+stateBadge(p)+'</div>'+
        '<div class="rmeta">'+esc(p.project)+'</div><div class="rdiff">'+miniDiff(p)+'</div></div></article>';
    }).join("");
  }

  function changeBlock(p){
    if(p.tasks) return '<div class="diffbox">'+p.tasks.map(function(t){
      return '<div class="task-add"><span class="plus">+</span><span class="tt">'+esc(t)+'</span><span class="tag">담당자 미지정</span></div>';}).join("")+'</div>';
    return '<div class="diffbox">'+p.diff.map(function(x){
      return '<div class="drow"><span class="dk">'+esc(x.k)+'</span><span class="chip-b">'+esc(x.b)+'</span><span class="arrow">→</span><span class="chip-a">'+esc(x.a)+'</span></div>';}).join("")+'</div>';
  }
  function evidBlock(p){
    return '<div class="section-label">근거</div>'+
      '<blockquote class="evid-quote">'+esc(p.evidence.quote)+'</blockquote>'+
      '<div class="evid-meta">출처 '+(p.review==="blocked"?'<span style="color:var(--crit-fg);font-weight:600">'+esc(p.evidence.source)+'</span>':'<a href="#">'+esc(p.evidence.source)+'</a>')+
      ' · 원본 상태: '+esc(p.evidence.origin)+' · 작성: AI · 분석 '+esc(p.evidence.at)+' · 중요도 '+sevName(p.sev)+' · '+esc(p.evidence.expire)+'</div>';
  }

  function renderDetail(){
    var p = proposals.find(function(x){return x.id===selectedId;});
    var d = document.getElementById("detail");
    snoozeOpen = false;
    if(!p){ d.innerHTML='<div class="empty"><div class="hand">검토 끝! 깔끔해요</div><div>지금 탭에 선택할 제안이 없습니다</div></div>'; return; }

    // 처리됨(결과) 보기
    if(p.status!=="pending"){
      var label = p.status==="approved" ? "반영됨" : p.status==="rejected" ? "거절됨" : "폐기됨";
      var head = p.status==="approved"
        ? '<div class="banner ok"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M20 6 9 17l-5-5"/></svg><div><b>반영 완료</b> <span class="hand" style="font-size:20px;margin-left:6px">반영 완료!</span><br>확정 상태에 적용되고 이력에 기록됐습니다.</div></div>'
        : '<div class="banner" style="background:var(--surface);border:1px solid var(--border);color:var(--muted)"><div><b>'+label+'</b><br>운영 상태에는 반영되지 않았습니다.</div></div>';
      d.innerHTML = '<div class="detail-in"><div class="dhead"><span class="sev-dot '+p.sev+'"></span><h2>'+esc(p.title)+'</h2><span class="ptag">'+esc(p.project)+'</span></div>'+
        head +
        (p.status==="approved" ? '<div class="section-label">반영된 변경</div>'+changeBlock(p) : '')+
        '<div class="section-label">이력</div><div class="hist-line">· 작업: '+label+'<br>· 주체: 나 (사용자 승인)<br>· 시각: 방금<br>· 근거: '+esc(p.evidence.source)+(p.editedTo?'<br>· 수정: 사용자가 값을 '+esc(p.editedTo)+'(으)로 수정 후 확정':'')+'</div>'+
        (p.status==="approved" ? '<div class="dacts"><a class="btn" href="#">프로젝트 상세에서 보기</a></div>' : '')+
        '</div>';
      return;
    }

    // 수정 폼
    if(editing){
      var cur = p.tasks ? p.tasks.join(", ") : p.diff[0].a;
      var fieldLabel = p.tasks ? "할 일 목록 (쉼표로 구분)" : p.diff[0].k;
      d.innerHTML = '<div class="detail-in"><div class="dhead"><span class="sev-dot '+p.sev+'"></span><h2>수정 후 승인</h2><span class="ptag">'+esc(p.project)+'</span></div>'+
        '<div class="note">AI 제안값을 고쳐 반영하면 <b>“사용자 확정값”</b>으로 기록되고, 이후 재분석이 이 수정을 덮지 않습니다.</div>'+
        '<div class="section-label">값 수정</div><div class="editbox"><div class="field"><label>'+esc(fieldLabel)+'</label>'+
        '<input id="editInput" type="text" value="'+esc(cur)+'"></div></div>'+
        '<div class="dacts"><button class="btn primary" data-act="saveEdit">이 값으로 반영</button><button class="btn ghost" data-act="cancelEdit">취소</button></div></div>';
      var inp=document.getElementById("editInput"); if(inp){ inp.focus(); inp.setSelectionRange(cur.length,cur.length); }
      return;
    }

    // 미룬 항목 보기
    if(p.snoozedUntil){
      d.innerHTML = '<div class="detail-in"><div class="dhead"><span class="sev-dot '+p.sev+'"></span><h2>'+esc(p.title)+'</h2><span class="ptag">'+esc(p.project)+'</span></div>'+
        '<div class="banner snooze"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><div><b>'+fmt(p.snoozedUntil)+'까지 미뤄둠</b><br>그날 다시 알려드릴게요. 미뤄도 근거(음성)는 계속 만료 카운트됩니다 — <b>'+esc(p.evidence.expire)+'</b> 전에 검토하세요.</div></div>'+
        '<div class="section-label">변경 전후</div>'+changeBlock(p)+ evidBlock(p)+
        '<div class="dacts"><button class="btn primary" data-act="now">지금 검토</button><button class="btn" data-act="snooze">미루기 변경</button><button class="btn ghost" data-act="reject">거절</button>'+
        '<div class="snooze-menu" id="snoozeMenu"></div></div></div>';
      return;
    }

    // 일반 pending 상세
    var banner="";
    if(p.review==="conflict") banner='<div class="banner conflict"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg><div><b>버전 충돌 — 승인할 수 없습니다.</b><br>'+esc(p.conflict)+'</div></div>';
    if(p.review==="blocked")  banner='<div class="banner blocked"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg><div><b>근거 삭제 — 승인할 수 없습니다.</b><br>'+esc(p.blocked)+'</div></div>';

    var acts;
    if(p.review==="conflict") acts='<button class="btn primary" data-act="recheck">최신 상태와 다시 비교</button><button class="btn" data-act="snooze">미루기</button><button class="btn ghost" data-act="reject">제안 폐기</button>';
    else if(p.review==="blocked") acts='<button class="btn" data-act="find">새 근거 찾기</button><button class="btn ghost" data-act="reject">제안 폐기</button>';
    else acts='<button class="btn primary" data-act="approve">승인</button><button class="btn" data-act="edit">수정 후 승인</button><button class="btn" data-act="snooze">미루기</button><button class="btn ghost" data-act="reject">거절</button>';

    d.innerHTML = '<div class="detail-in"><div class="dhead"><span class="sev-dot '+p.sev+'"></span><h2>'+esc(p.title)+'</h2><span class="ptag">'+esc(p.project)+'</span>'+(p.review==="need"?'<span class="need">상세 확인 필요</span>':'')+'</div>'+
      banner +
      '<div class="section-label">변경 대상</div><div class="target">'+esc(p.target)+'</div>'+
      '<div class="section-label">변경 전후</div>'+changeBlock(p)+ evidBlock(p)+
      '<div class="note">'+esc(p.note)+'</div>'+
      '<div class="dacts">'+acts+'<div class="snooze-menu" id="snoozeMenu"></div></div></div>';
  }

  function snoozeMenuHTML(){
    var t=addDays(TODAY,1), w=addDays(TODAY,2), n=addDays(TODAY,3);
    return '<div class="sm-h">언제 다시 볼까요?</div>'+
      '<button data-snooze="'+t.getTime()+'">내일 <span class="d">'+fmt(t)+' (토)</span></button>'+
      '<button data-snooze="'+w.getTime()+'">이번 주말 <span class="d">'+fmt(w)+' (일)</span></button>'+
      '<button data-snooze="'+n.getTime()+'">다음 주 <span class="d">'+fmt(n)+' (월)</span></button>'+
      '<div class="sm-date"><input type="date" id="snoozeDate" min="2026-10-18" value="2026-10-20"><button class="btn primary" data-act="snoozeCustom" style="height:34px">지정</button></div>';
  }

  var toastEl=document.getElementById("toast"), toastTimer;
  function toast(html){ toastEl.innerHTML=html; toastEl.classList.add("show"); clearTimeout(toastTimer); toastTimer=setTimeout(function(){toastEl.classList.remove("show");},3000); }

  function afterChange(nextMsg){
    var p=proposals.find(function(x){return x.id===selectedId;});
    if(!p || !inTab(p)){ var first=proposals.filter(inTab)[0]; selectedId=first?first.id:null; }
    renderTabs(); renderList(); renderDetail(); updateBatch();
    if(nextMsg) toast(nextMsg);
  }

  function doSnooze(ts){
    var p=proposals.find(function(x){return x.id===selectedId;});
    p.snoozedUntil=new Date(parseInt(ts,10)); delete picked[p.id];
    afterChange('<span class="u">미뤄둠</span> '+fmt(p.snoozedUntil)+'에 다시 알림 · 근거 만료 전 검토하세요');
  }

  document.getElementById("list").addEventListener("click", function(e){
    var cb=e.target.closest(".rcheck");
    if(cb){ picked[cb.dataset.pick]=cb.checked; updateBatch(); e.stopPropagation(); return; }
    var card=e.target.closest(".rcard");
    if(card){ editing=false; selectedId=card.dataset.id; renderList(); renderDetail(); }
  });

  document.getElementById("detail").addEventListener("click", function(e){
    var b=e.target.closest("button[data-act], button[data-snooze], a.btn"); if(!b) return;
    var p=proposals.find(function(x){return x.id===selectedId;});

    if(b.dataset.snooze){ doSnooze(b.dataset.snooze); return; }
    var act=b.dataset.act;
    if(act==="snooze"){
      var m=document.getElementById("snoozeMenu");
      snoozeOpen=!snoozeOpen; m.classList.toggle("open",snoozeOpen);
      if(snoozeOpen) m.innerHTML=snoozeMenuHTML();
      return;
    }
    if(act==="snoozeCustom"){ var dv=document.getElementById("snoozeDate").value; if(dv){ var parts=dv.split("-"); doSnooze(new Date(+parts[0],parts[1]-1,+parts[2]).getTime()); } return; }
    if(act==="now"){ p.snoozedUntil=null; afterChange('다시 오늘 검토 목록으로 가져왔어요'); return; }
    if(act==="approve"){ p.status="approved"; delete picked[p.id]; afterChange('<span class="u">승인됨</span> 확정 상태에 반영 · 근거·전후 버전 기록'); return; }
    if(act==="reject"){ p.status="rejected"; delete picked[p.id]; afterChange('거절됨 · 같은 근거 재생성 시 목록에서 숨김'); return; }
    if(act==="edit"){ editing=true; renderDetail(); return; }
    if(act==="cancelEdit"){ editing=false; renderDetail(); return; }
    if(act==="saveEdit"){
      var v=document.getElementById("editInput").value;
      p.editedTo=v; if(!p.tasks){ p.diff[0].a=v; } p.status="approved"; editing=false;
      afterChange('<span class="u">수정 후 반영됨</span> 사용자 확정값으로 기록');
      return;
    }
    if(act==="recheck"){ // 충돌 재비교: 최신 상태가 이미 목표값과 같아짐 → 제안 불필요
      p.conflict=null; p.review="resolved";
      document.getElementById("detail").innerHTML =
        '<div class="detail-in"><div class="dhead"><span class="sev-dot '+p.sev+'"></span><h2>'+esc(p.title)+'</h2><span class="ptag">'+esc(p.project)+'</span></div>'+
        '<div class="banner ok"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M20 6 9 17l-5-5"/></svg><div><b>최신 상태를 다시 확인했어요.</b><br>현재 상태가 이미 <b>진행 중</b>으로 바뀌어, 이 제안은 더 이상 필요하지 않습니다.</div></div>'+
        '<div class="note">다른 기기에서 먼저 반영된 변경과 중복되므로 폐기를 권장합니다. 승인 효과는 1회만 적용됩니다.</div>'+
        '<div class="dacts"><button class="btn primary" data-act="reject">제안 폐기</button></div></div>';
      toast('최신 상태 재확인 완료 · 변경 불필요');
      return;
    }
    if(act==="find"){
      document.getElementById("detail").querySelector(".dacts").insertAdjacentHTML("beforebegin",
        '<div class="note" style="color:var(--crit-fg);border-color:color-mix(in srgb,var(--crit-fg) 30%,transparent)">연결 가능한 다른 근거를 찾지 못했습니다. 근거 없이 확정할 수 없으므로 폐기를 권장합니다.</div>');
      toast('대체 근거 없음 · 폐기 권장');
      return;
    }
  });

  function updateBatch(){
    var n=Object.keys(picked).filter(function(k){return picked[k];}).length;
    document.getElementById("selInfo").textContent="선택 "+n+"건";
    var btn=document.getElementById("batchBtn"); btn.disabled=n===0; btn.textContent=n>0?"선택 "+n+"건 승인":"선택 승인";
  }
  document.getElementById("batchBtn").addEventListener("click", function(){
    var ids=Object.keys(picked).filter(function(k){return picked[k];}); if(!ids.length) return;
    ids.forEach(function(id){ var p=proposals.find(function(x){return x.id===id;}); if(p){p.status="approved";} delete picked[id]; });
    selectedId=null; afterChange('<span class="u">'+ids.length+'건 승인됨</span> 항목별 결과 반영 · 상태/기한 변경은 제외');
  });
  document.getElementById("selAll").addEventListener("change", function(){
    var on=this.checked; proposals.forEach(function(p){ if(selectable(p)) picked[p.id]=on; });
    renderList(); updateBatch();
  });

  document.getElementById("tabs").addEventListener("click", function(e){
    var b=e.target.closest("button"); if(!b) return;
    this.querySelectorAll("button").forEach(function(x){x.classList.remove("on");});
    b.classList.add("on"); tab=b.dataset.t; editing=false;
    var first=proposals.filter(inTab)[0]; selectedId=first?first.id:null;
    renderList(); renderDetail();
  });

  var root=document.documentElement;
  document.getElementById("themeBtn").addEventListener("click", function(){
    var cur=root.getAttribute("data-theme"); if(!cur) cur=window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";
    root.setAttribute("data-theme", cur==="dark"?"light":"dark");
  });

  renderTabs(); renderList(); renderDetail(); updateBatch();
</script>
