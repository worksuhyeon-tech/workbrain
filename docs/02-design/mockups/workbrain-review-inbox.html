  /* ============ 디자인 토큰 (대시보드와 동일 시스템: Fluent + 글래스 포인트) ============ */
  :root{
    --canvas:#ffffff; --surface:#f5f8fb; --card:#ffffff; --card-2:#fbfdfe;
    --border:#e3e8ee; --border-strong:#cfd8e2; --ink:#0e1726; --body:#17253d; --muted:#5c6b7c;
    --primary:#0078d4; --primary-hover:#106ebe; --on-primary:#ffffff; --link:#0067b8;
    --dark-action:#091f2c; --pill-active:#06161f;
    --good-fg:#0f7a43; --warn-fg:#935600; --crit-fg:#b02a1f; --info-fg:#0067b8;
    --g-green:linear-gradient(135deg,#15c08a,#78e7c3); --g-purple:linear-gradient(135deg,#8b7bf2,#b9a7ff);
    --glass-front:linear-gradient(135deg,rgba(255,255,255,.60),rgba(255,255,255,.14));
    --glass-border:rgba(255,255,255,.65);
    --shadow-sm:0 1px 2px rgba(14,23,38,.08),0 1px 1px rgba(14,23,38,.05);
    --shadow-md:0 2px 8px rgba(14,23,38,.10),0 1px 3px rgba(14,23,38,.06);
    --shadow-lg:0 12px 32px rgba(14,23,38,.14),0 4px 10px rgba(14,23,38,.08);
    --s-xs:4px; --s-sm:8px; --s-md:12px; --s-base:16px; --s-lg:24px; --s-xl:32px; --s-xxl:48px;
    --r-sm:2px; --r-md:4px; --r-lg:8px; --r-xl:14px; --r-xxl:24px; --r-pill:200px;
    --font:"Pretendard","Pretendard Variable",system-ui,-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    --font-display:"Pretendard","Pretendard Variable",system-ui,-apple-system,"Malgun Gothic",sans-serif;
    --font-hand:"HandAccent","Pretendard",cursive;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --canvas:#0b1117; --surface:#0f1620; --card:#141d27; --card-2:#17212c;
      --border:#243240; --border-strong:#31424f; --ink:#eef4fa; --body:#c3d0dc; --muted:#8ea0b2;
      --primary:#3aa0f0; --primary-hover:#58b0f4; --on-primary:#06131d; --link:#6bb8f6;
      --dark-action:#0a1a24; --pill-active:#eaf2f9;
      --good-fg:#55d393; --warn-fg:#e6a84a; --crit-fg:#f08478; --info-fg:#6bb8f6;
      --glass-front:linear-gradient(135deg,rgba(255,255,255,.22),rgba(255,255,255,.05));
      --glass-border:rgba(255,255,255,.28);
      --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow-md:0 2px 10px rgba(0,0,0,.45); --shadow-lg:0 14px 36px rgba(0,0,0,.55);
    }
  }
  :root[data-theme="light"]{
    --canvas:#ffffff; --surface:#f5f8fb; --card:#ffffff; --card-2:#fbfdfe;
    --border:#e3e8ee; --border-strong:#cfd8e2; --ink:#0e1726; --body:#17253d; --muted:#5c6b7c;
    --primary:#0078d4; --primary-hover:#106ebe; --on-primary:#ffffff; --link:#0067b8;
    --dark-action:#091f2c; --pill-active:#06161f;
    --good-fg:#0f7a43; --warn-fg:#935600; --crit-fg:#b02a1f; --info-fg:#0067b8;
    --glass-front:linear-gradient(135deg,rgba(255,255,255,.60),rgba(255,255,255,.14)); --glass-border:rgba(255,255,255,.65);
    --shadow-sm:0 1px 2px rgba(14,23,38,.08),0 1px 1px rgba(14,23,38,.05);
    --shadow-md:0 2px 8px rgba(14,23,38,.10),0 1px 3px rgba(14,23,38,.06);
    --shadow-lg:0 12px 32px rgba(14,23,38,.14),0 4px 10px rgba(14,23,38,.08);
  }
  :root[data-theme="dark"]{
    --canvas:#0b1117; --surface:#0f1620; --card:#141d27; --card-2:#17212c;
    --border:#243240; --border-strong:#31424f; --ink:#eef4fa; --body:#c3d0dc; --muted:#8ea0b2;
    --primary:#3aa0f0; --primary-hover:#58b0f4; --on-primary:#06131d; --link:#6bb8f6;
    --dark-action:#0a1a24; --pill-active:#eaf2f9;
    --good-fg:#55d393; --warn-fg:#e6a84a; --crit-fg:#f08478; --info-fg:#6bb8f6;
    --glass-front:linear-gradient(135deg,rgba(255,255,255,.22),rgba(255,255,255,.05)); --glass-border:rgba(255,255,255,.28);
    --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow-md:0 2px 10px rgba(0,0,0,.45); --shadow-lg:0 14px 36px rgba(0,0,0,.55);
  }

  *{box-sizing:border-box;}
  body{margin:0;background:var(--surface);color:var(--body);font-family:var(--font);
    font-size:17px;line-height:1.5;letter-spacing:-.1px;-webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:var(--font-display);color:var(--ink);margin:0;text-wrap:balance;}
  a{color:var(--link);text-decoration:none;} a:hover{text-decoration:underline;}
  button{font-family:inherit;cursor:pointer;}
  input,select{font-family:inherit;}
  .num{font-variant-numeric:tabular-nums;}
  :focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:var(--r-md);}
  .hand{font-family:var(--font-hand);font-weight:400;letter-spacing:0;}
  .greet{font-family:var(--font-hand);font-size:24px;line-height:1;color:var(--primary);margin-bottom:4px;}
  .brand-tag{font-family:var(--font-hand);font-size:21px;color:var(--muted);line-height:1;margin-top:2px;}

  /* ============ 앱 셸 ============ */
  .app{display:grid;grid-template-columns:240px 1fr;grid-template-rows:56px 1fr;
    grid-template-areas:"rail topbar" "rail main";height:100vh;}
  .topbar{grid-area:topbar;display:flex;align-items:center;gap:var(--s-base);
    padding:0 var(--s-lg);background:var(--card);border-bottom:1px solid var(--border);}
  .search{flex:1;max-width:520px;display:flex;align-items:center;gap:var(--s-sm);
    height:34px;padding:0 var(--s-md);background:var(--surface);border:1px solid var(--border);
    border-radius:var(--r-md);color:var(--muted);font-size:15px;}
  .search input{border:0;background:transparent;outline:none;color:var(--body);font:inherit;font-size:15px;width:100%;}
  .cost-chip{display:flex;align-items:center;gap:var(--s-sm);height:32px;padding:0 var(--s-md);
    border-radius:var(--r-pill);background:color-mix(in srgb,var(--warn-fg) 14%,transparent);
    color:var(--warn-fg);font-size:14px;font-weight:600;white-space:nowrap;}
  .icon-btn{width:34px;height:34px;display:grid;place-items:center;border:1px solid transparent;
    border-radius:var(--r-md);background:transparent;color:var(--muted);}
  .icon-btn:hover{background:var(--surface);color:var(--ink);}
  .avatar{width:32px;height:32px;border-radius:50%;background:var(--g-purple);
    display:grid;place-items:center;color:#fff;font-size:14px;font-weight:700;}

  .rail{grid-area:rail;background:var(--card);border-right:1px solid var(--border);
    display:flex;flex-direction:column;padding:var(--s-md);gap:var(--s-xs);overflow:hidden;}
  .brand{display:flex;align-items:center;gap:var(--s-md);padding:var(--s-sm) var(--s-sm) var(--s-base);}
  .brand .logo{width:34px;height:34px;border-radius:var(--r-lg);position:relative;flex:none;}
  .brand .logo .plate{position:absolute;inset:4px -4px -4px 4px;border-radius:var(--r-lg);background:var(--g-green);opacity:.9;}
  .brand .logo .glass{position:absolute;inset:0;border-radius:var(--r-lg);background:var(--glass-front);
    border:1px solid var(--glass-border);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    display:grid;place-items:center;font-size:19px;box-shadow:inset 0 1px 0 rgba(255,255,255,.6);}
  .brand .name{font-family:var(--font-display);font-weight:700;font-size:20px;color:var(--ink);letter-spacing:-.4px;}
  .nav-item{display:flex;align-items:center;gap:var(--s-md);height:40px;padding:0 var(--s-md);
    border-radius:var(--r-md);color:var(--body);font-size:15px;font-weight:500;border:0;background:transparent;width:100%;text-align:left;}
  .nav-item svg{color:var(--muted);flex:none;}
  .nav-item:hover{background:var(--surface);}
  .nav-item.active{background:color-mix(in srgb,var(--primary) 12%,transparent);color:var(--ink);font-weight:600;}
  .nav-item.active svg{color:var(--primary);}
  .nav-item .badge{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:var(--r-pill);
    background:var(--crit-fg);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;}
  .nav-sep{height:1px;background:var(--border);margin:var(--s-sm);}
  .rail-foot{margin-top:auto;padding:var(--s-sm);font-size:12px;color:var(--muted);line-height:1.4;}

  .main{grid-area:main;overflow:hidden;display:flex;flex-direction:column;padding:var(--s-lg) var(--s-xl) 0;}
  .page-head{margin-bottom:var(--s-base);}
  .page-head h1{font-size:36px;font-weight:500;letter-spacing:-.8px;}
  .page-head .sub{color:var(--muted);font-size:15px;margin-top:2px;}

  .toolbar{display:flex;align-items:center;gap:var(--s-md);flex-wrap:wrap;
    padding:var(--s-md) 0 var(--s-base);border-bottom:1px solid var(--border);margin-bottom:var(--s-base);}
  .tabs{display:flex;gap:var(--s-xs);background:var(--surface);border:1px solid var(--border);padding:3px;border-radius:var(--r-pill);}
  .tabs button{height:32px;padding:0 var(--s-base);border:0;border-radius:var(--r-pill);background:transparent;color:var(--muted);font-size:14px;font-weight:600;}
  .tabs button.on{background:var(--pill-active);color:#fff;}
  :root[data-theme="dark"] .tabs button.on{color:#06131d;}
  .spacer{flex:1;}
  .selall{display:flex;align-items:center;gap:var(--s-sm);font-size:14px;color:var(--muted);font-weight:600;cursor:pointer;}
  .selinfo{font-size:14px;color:var(--muted);font-weight:600;}
  .btn{height:34px;padding:0 var(--s-base);border-radius:var(--r-md);font-size:14px;font-weight:600;
    border:1px solid var(--border-strong);background:var(--card);color:var(--body);display:inline-flex;align-items:center;gap:6px;}
  .btn:hover{background:var(--surface);}
  .btn.primary{background:var(--primary);color:var(--on-primary);border-color:var(--primary);}
  .btn.primary:hover{background:var(--primary-hover);}
  .btn.ghost{border-color:transparent;color:var(--muted);}
  .btn.ghost:hover{color:var(--crit-fg);background:color-mix(in srgb,var(--crit-fg) 10%,transparent);}
  .btn:disabled{opacity:.45;cursor:not-allowed;}

  .review-grid{flex:1;display:grid;grid-template-columns:360px 1fr;gap:var(--s-base);min-height:0;padding-bottom:var(--s-lg);}
  .list{overflow-y:auto;display:flex;flex-direction:column;gap:var(--s-sm);padding-right:var(--s-xs);}
  .detail{overflow-y:auto;background:var(--card);border:1px solid var(--border);border-radius:var(--r-xl);box-shadow:var(--shadow-sm);position:relative;}

  .rcard{display:flex;gap:var(--s-md);padding:var(--s-md);background:var(--card);border:1px solid var(--border);
    border-radius:var(--r-lg);position:relative;cursor:pointer;transition:border-color .15s,box-shadow .15s,opacity .25s,transform .25s;}
  .rcard::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:var(--r-pill);background:var(--muted);}
  .rcard.sev-high::before{background:var(--crit-fg);} .rcard.sev-mid::before{background:var(--warn-fg);} .rcard.sev-low::before{background:var(--info-fg);}
  .rcard.done::before{background:var(--good-fg);}
  .rcard:hover{border-color:var(--border-strong);}
  .rcard.selected{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary),var(--shadow-sm);}
  .rcard.leaving{opacity:0;transform:translateX(14px);}
  .rcheck{width:18px;height:18px;flex:none;margin-top:2px;accent-color:var(--primary);}
  .rbody{min-width:0;flex:1;padding-left:4px;}
  .rtop{display:flex;align-items:center;gap:var(--s-sm);margin-bottom:3px;}
  .rtitle{font-size:14px;font-weight:600;color:var(--ink);}
  .rmeta{font-size:13px;color:var(--muted);margin-bottom:6px;}
  .rdiff{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .state-badge{font-size:11px;font-weight:700;padding:2px 7px;border-radius:var(--r-pill);margin-left:auto;white-space:nowrap;}
  .sb-need{color:var(--warn-fg);background:color-mix(in srgb,var(--warn-fg) 14%,transparent);}
  .sb-conflict{color:var(--crit-fg);background:color-mix(in srgb,var(--crit-fg) 14%,transparent);}
  .sb-blocked{color:var(--muted);background:var(--surface);}
  .sb-snooze{color:var(--info-fg);background:color-mix(in srgb,var(--info-fg) 13%,transparent);}
  .sb-approved{color:var(--good-fg);background:color-mix(in srgb,var(--good-fg) 14%,transparent);}
  .sb-rejected{color:var(--muted);background:var(--surface);}

  .chip-b,.chip-a{font-size:12px;font-weight:600;padding:3px 9px;border-radius:var(--r-md);font-variant-numeric:tabular-nums;}
  .chip-b{color:var(--muted);background:var(--surface);text-decoration:line-through;}
  .chip-a{color:var(--good-fg);background:color-mix(in srgb,var(--good-fg) 13%,transparent);}
  .arrow{color:var(--muted);}
  .tag{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--border);padding:3px 9px;border-radius:var(--r-pill);}

  .detail-in{padding:var(--s-lg);}
  .dhead{display:flex;align-items:center;gap:var(--s-sm);flex-wrap:wrap;margin-bottom:var(--s-base);}
  .sev-dot{width:10px;height:10px;border-radius:50%;flex:none;}
  .sev-dot.high{background:var(--crit-fg);} .sev-dot.mid{background:var(--warn-fg);} .sev-dot.low{background:var(--info-fg);}
  .dhead h2{font-size:21px;font-weight:600;letter-spacing:-.4px;}
  .ptag{font-size:13px;color:var(--body);background:var(--surface);border:1px solid var(--border);padding:3px 10px;border-radius:var(--r-pill);font-weight:600;}
  .need{font-size:12px;font-weight:700;color:var(--warn-fg);background:color-mix(in srgb,var(--warn-fg) 14%,transparent);padding:3px 9px;border-radius:var(--r-pill);}

  .banner{display:flex;gap:var(--s-md);padding:var(--s-md);border-radius:var(--r-lg);margin-bottom:var(--s-base);font-size:14px;line-height:1.5;align-items:flex-start;}
  .banner svg{flex:none;margin-top:2px;}
  .banner.conflict{background:color-mix(in srgb,var(--crit-fg) 11%,transparent);color:var(--crit-fg);border:1px solid color-mix(in srgb,var(--crit-fg) 30%,transparent);}
  .banner.blocked{background:color-mix(in srgb,var(--warn-fg) 12%,transparent);color:var(--warn-fg);border:1px solid color-mix(in srgb,var(--warn-fg) 30%,transparent);}
  .banner.snooze{background:color-mix(in srgb,var(--info-fg) 10%,transparent);color:var(--info-fg);border:1px solid color-mix(in srgb,var(--info-fg) 28%,transparent);}
  .banner.ok{background:color-mix(in srgb,var(--good-fg) 12%,transparent);color:var(--good-fg);border:1px solid color-mix(in srgb,var(--good-fg) 30%,transparent);}
  .banner b{font-weight:700;}

  .section-label{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;
    margin:var(--s-lg) 0 var(--s-sm);display:flex;align-items:center;gap:var(--s-sm);}
  .section-label .hand{font-size:17px;text-transform:none;letter-spacing:0;color:var(--primary);}
  .target{font-size:15px;color:var(--ink);font-weight:600;}

<script>

    { id:"p1", kind:"status", sev:"high", project:"자동차 사고접수 개편", title:"프로젝트 상태 변경 제안",
      review:"need", status:"pending", snoozedUntil:null,

      diff:[{k:"상태", b:"진행 중", a:"검토 대기"}],
      evidence:{ quote:"“이번 주 안에 접수 화면 개선안 확정하고 바로 현업 리뷰 들어가자”", source:"10/16 주간회의 · 02:14 구간", origin:"진행 중", at:"10/16 21:03", expire:"음성 11/15 만료" },
      note:"상태 전환이라 일괄 승인 대상이 아닙니다. 승인하면 근거·작성 주체·전후 버전과 함께 이력에 기록됩니다." },

    { id:"p2", kind:"status", sev:"mid", project:"자동차 사고접수 개편", title:"할 일 기한 변경 제안",
      review:"need", status:"pending", snoozedUntil:null,
      target:"‘접수 화면 1차 피드백 반영’ · 기한",
      diff:[{k:"기한", b:"10/20 (화)", a:"10/23 (금)"}],
      evidence:{ quote:"“자동판독 요건서는 다음 주 금요일까지 미루고, 그 전엔 범위만 잡자”", source:"10/16 주간회의 · 05:41 구간", origin:"10/20", at:"10/16 21:03", expire:"음성 11/15 만료" },
      note:"기한 변경도 상세 확인 후 개별 적용됩니다. 날짜만 지정된 기한은 날짜 그대로 보존됩니다." },

    { id:"p3", kind:"task", sev:"low", project:"자동차 사고접수 개편", title:"새 할 일 5건 제안",
      review:"ok", status:"pending", snoozedUntil:null,
      target:"자동차 사고접수 개편 · 새 할 일",
      tasks:["개선안 확정 후 현업 리뷰 요청","자동판독 요건서 범위 잡기","개발 공수 다시 산정 · 팔로업 박지훈","고객 안내 문구 초안 · 담당 확인","판독 솔루션 업체 정하기"],
      evidence:{ quote:"“개발 일정이랑 공수 다시 보고, 안내 문구도 초안부터 잡아줘”", source:"10/16 주간회의 · 08:20 구간", origin:"-", at:"10/16 21:03", expire:"음성 11/15 만료" },
      note:"새 할 일 후보는 기록 화면(주간회의)에서도 바로 골라 추가할 수 있어요. 담당자가 말에 나오면 팔로업, 없으면 확인 필요로 둡니다. 일괄 승인 가능 항목입니다." },

    { id:"p4", kind:"status", sev:"high", project:"장기보험 지급심사 자동화", title:"프로젝트 상태 변경 제안",
      review:"conflict", status:"pending", snoozedUntil:null,
      target:"장기보험 지급심사 자동화 · 프로젝트 상태",
      diff:[{k:"상태", b:"주의", a:"진행 중"}],
      evidence:{ quote:"“규칙 데이터 들어왔으니까 이제 정상 진행으로 봐도 될 듯”", source:"10/16 데일리 · 01:02 구간", origin:"주의", at:"10/16 21:05", expire:"음성 11/15 만료" },
      conflict:"다른 기기(웹)에서 방금 이 프로젝트 상태를 직접 변경했습니다. 제안의 기준 버전과 현재 최신 상태가 다릅니다.",
      note:"최신 상태와 다시 비교한 뒤에만 승인할 수 있습니다." },

    { id:"p5", kind:"task", sev:"mid", project:"보상 안내 챗봇 오픈", title:"할 일 기한 변경 제안",
      review:"blocked", status:"pending", snoozedUntil:null,
      target:"보상 안내 챗봇 오픈 · ‘현업 인수 테스트’ 기한",
      diff:[{k:"기한", b:"10/25", a:"10/28"}],
      evidence:{ quote:"(근거 전사 구간이 삭제됨)", source:"삭제된 기록", origin:"10/25", at:"10/16 20:40", expire:"근거 삭제됨" },
      blocked:"이 제안의 근거가 된 전사 구간이 삭제되었습니다. 새 근거가 없으면 승인할 수 없습니다.",
      note:"원본 삭제 시 파생 제안은 재검토 대상으로 격리됩니다." }
  ];

  var tab = "today", selectedId = "p1", picked = {}, editing = false, snoozeOpen = false;

  function esc(s){return String(s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
  function sevName(s){return s==="high"?"높음":s==="mid"?"보통":"낮음";}
  function selectable(p){ return p.status==="pending" && !p.snoozedUntil && p.review==="ok"; }

  function inTab(p){
    if(tab==="today")   return p.status==="pending" && !p.snoozedUntil;
    if(tab==="snoozed") return p.status==="pending" && !!p.snoozedUntil;
    if(tab==="done")    return p.status==="approved" || p.status==="rejected" || p.status==="discarded";
    return true;
  }
  function counts(){
    return {
      today: proposals.filter(function(p){return p.status==="pending"&&!p.snoozedUntil;}).length,
      snoozed: proposals.filter(function(p){return p.status==="pending"&&!!p.snoozedUntil;}).length,
      done: proposals.filter(function(p){return p.status!=="pending";}).length
    };
  }
  function stateBadge(p){
    if(p.status==="approved") return '<span class="state-badge sb-approved">승인됨</span>';
    if(p.status==="rejected") return '<span class="state-badge sb-rejected">거절됨</span>';
    if(p.status==="discarded")return '<span class="state-badge sb-rejected">폐기됨</span>';
    if(p.snoozedUntil)        return '<span class="state-badge sb-snooze">미룸 '+fmt(p.snoozedUntil)+'</span>';
    if(p.review==="conflict") return '<span class="state-badge sb-conflict">충돌</span>';
    if(p.review==="blocked")  return '<span class="state-badge sb-blocked">차단</span>';
    if(p.review==="need")     return '<span class="state-badge sb-need">상세 확인</span>';
    return "";
  }
  function miniDiff(p){
    if(p.tasks) return '<span class="tag">할 일 '+p.tasks.length+'건</span>';
    var d=p.diff[0]; return '<span class="chip-b">'+esc(d.b)+'</span><span class="arrow">→</span><span class="chip-a">'+esc(d.a)+'</span>';
  }

  function renderTabs(){
    var c = counts();
    document.querySelectorAll("#tabs [data-c]").forEach(function(el){ el.textContent = c[el.dataset.c]; });
    document.getElementById("navBadge").textContent = c.today + c.snoozed;
  }

  function renderList(){
    var list = document.getElementById("list");
    var items = proposals.filter(inTab);
    if(items.length===0){
      var msg = tab==="snoozed" ? "미뤄둔 제안이 없습니다." : tab==="done" ? "오늘 처리한 제안이 없습니다." : "오늘 검토할 제안이 없습니다.";
      list.innerHTML = '<div style="color:var(--muted);font-size:14px;padding:16px">'+msg+'</div>'; return;
    }
    list.innerHTML = items.map(function(p){
      var done = p.status!=="pending";
      return '<article class="rcard sev-'+p.sev+(done?' done':'')+(p.id===selectedId?' selected':'')+'" data-id="'+p.id+'" tabindex="0">'+
        (selectable(p) ? '<input type="checkbox" class="rcheck" data-pick="'+p.id+'" '+(picked[p.id]?'checked':'')+' aria-label="선택">'
                       : '<span style="width:18px;flex:none"></span>')+
        '<div class="rbody"><div class="rtop"><span class="rtitle">'+esc(p.title)+'</span>'+stateBadge(p)+'</div>'+
        '<div class="rmeta">'+esc(p.project)+'</div><div class="rdiff">'+miniDiff(p)+'</div></div></article>';
    }).join("");
  }

  function changeBlock(p){
    if(p.tasks) return '<div class="diffbox">'+p.tasks.map(function(t){
      return '<div class="task-add"><span class="plus">+</span><span class="tt">'+esc(t)+'</span><span class="tag">담당자 미지정</span></div>';}).join("")+'</div>';
    return '<div class="diffbox">'+p.diff.map(function(x){
      return '<div class="drow"><span class="dk">'+esc(x.k)+'</span><span class="chip-b">'+esc(x.b)+'</span><span class="arrow">→</span><span class="chip-a">'+esc(x.a)+'</span></div>';}).join("")+'</div>';
  }
  function evidBlock(p){
    return '<div class="section-label">근거</div>'+
      '<blockquote class="evid-quote">'+esc(p.evidence.quote)+'</blockquote>'+
      '<div class="evid-meta">출처 '+(p.review==="blocked"?'<span style="color:var(--crit-fg);font-weight:600">'+esc(p.evidence.source)+'</span>':'<a href="#">'+esc(p.evidence.source)+'</a>')+
      ' · 원본 상태: '+esc(p.evidence.origin)+' · 작성: AI · 분석 '+esc(p.evidence.at)+' · 중요도 '+sevName(p.sev)+' · '+esc(p.evidence.expire)+'</div>';
  }

  function renderDetail(){
    var p = proposals.find(function(x){return x.id===selectedId;});
    var d = document.getElementById("detail");
    snoozeOpen = false;
    if(!p){ d.innerHTML='<div class="empty"><div class="hand">검토 끝! 깔끔해요</div><div>지금 탭에 선택할 제안이 없습니다</div></div>'; return; }

    // 처리됨(결과) 보기
    if(p.status!=="pending"){
      var label = p.status==="approved" ? "반영됨" : p.status==="rejected" ? "거절됨" : "폐기됨";
      var head = p.status==="approved"
        ? '<div class="banner ok"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M20 6 9 17l-5-5"/></svg><div><b>반영 완료</b> <span class="hand" style="font-size:20px;margin-left:6px">반영 완료!</span><br>확정 상태에 적용되고 이력에 기록됐습니다.</div></div>'
        : '<div class="banner" style="background:var(--surface);border:1px solid var(--border);color:var(--muted)"><div><b>'+label+'</b><br>운영 상태에는 반영되지 않았습니다.</div></div>';
      d.innerHTML = '<div class="detail-in"><div class="dhead"><span class="sev-dot '+p.sev+'"></span><h2>'+esc(p.title)+'</h2><span class="ptag">'+esc(p.project)+'</span></div>'+
        head +
        (p.status==="approved" ? '<div class="section-label">반영된 변경</div>'+changeBlock(p) : '')+
        '<div class="section-label">이력</div><div class="hist-line">· 작업: '+label+'<br>· 주체: 나 (사용자 승인)<br>· 시각: 방금<br>· 근거: '+esc(p.evidence.source)+(p.editedTo?'<br>· 수정: 사용자가 값을 '+esc(p.editedTo)+'(으)로 수정 후 확정':'')+'</div>'+
        (p.status==="approved" ? '<div class="dacts"><a class="btn" href="#">프로젝트 상세에서 보기</a></div>' : '')+
        '</div>';
      return;
    }

    // 수정 폼
    if(editing){
      var cur = p.tasks ? p.tasks.join(", ") : p.diff[0].a;
      var fieldLabel = p.tasks ? "할 일 목록 (쉼표로 구분)" : p.diff[0].k;
      d.innerHTML = '<div class="detail-in"><div class="dhead"><span class="sev-dot '+p.sev+'"></span><h2>수정 후 승인</h2><span class="ptag">'+esc(p.project)+'</span></div>'+
        '<div class="note">AI 제안값을 고쳐 반영하면 <b>“사용자 확정값”</b>으로 기록되고, 이후 재분석이 이 수정을 덮지 않습니다.</div>'+
        '<div class="section-label">값 수정</div><div class="editbox"><div class="field"><label>'+esc(fieldLabel)+'</label>'+
        '<input id="editInput" type="text" value="'+esc(cur)+'"></div></div>'+
        '<div class="dacts"><button class="btn primary" data-act="saveEdit">이 값으로 반영</button><button class="btn ghost" data-act="cancelEdit">취소</button></div></div>';
      var inp=document.getElementById("editInput"); if(inp){ inp.focus(); inp.setSelectionRange(cur.length,cur.length); }
      return;
    }

    // 미룬 항목 보기
    if(p.snoozedUntil){
      d.innerHTML = '<div class="detail-in"><div class="dhead"><span class="sev-dot '+p.sev+'"></span><h2>'+esc(p.title)+'</h2><span class="ptag">'+esc(p.project)+'</span></div>'+
        '<div class="banner snooze"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><div><b>'+fmt(p.snoozedUntil)+'까지 미뤄둠</b><br>그날 <b>오늘 검토 목록에 다시 표시</b>돼요(알림은 다음 단계). 미뤄도 보관 기간은 계속 줄어요 — <b>'+esc(p.evidence.expire)+'</b>. 음성만 만료되면 전사로 계속 검토할 수 있어요.</div></div>'+
        '<div class="section-label">변경 전후</div>'+changeBlock(p)+ evidBlock(p)+
        '<div class="dacts"><button class="btn primary" data-act="now">지금 검토</button><button class="btn" data-act="snooze">미루기 변경</button><button class="btn ghost" data-act="reject">거절</button>'+
        '<div class="snooze-menu" id="snoozeMenu"></div></div></div>';
      return;
    }

    // 일반 pending 상세
    var banner="";
    if(p.review==="conflict") banner='<div class="banner conflict"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg><div><b>버전 충돌 — 승인할 수 없습니다.</b><br>'+esc(p.conflict)+'</div></div>';
    if(p.review==="blocked")  banner='<div class="banner blocked"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg><div><b>근거 삭제 — 승인할 수 없습니다.</b><br>'+esc(p.blocked)+'</div></div>';

    var acts;
    if(p.review==="conflict") acts='<button class="btn primary" data-act="recheck">최신 상태와 다시 비교</button><button class="btn" data-act="snooze">미루기</button><button class="btn ghost" data-act="reject">제안 폐기</button>';
    else if(p.review==="blocked") acts='<button class="btn" data-act="find">새 근거 찾기</button><button class="btn ghost" data-act="reject">제안 폐기</button>';
    else acts='<button class="btn primary" data-act="approve">승인</button><button class="btn" data-act="edit">수정 후 승인</button><button class="btn" data-act="snooze">미루기</button><button class="btn ghost" data-act="reject">거절</button>';

    d.innerHTML = '<div class="detail-in"><div class="dhead"><span class="sev-dot '+p.sev+'"></span><h2>'+esc(p.title)+'</h2><span class="ptag">'+esc(p.project)+'</span>'+(p.review==="need"?'<span class="need">상세 확인 필요</span>':'')+'</div>'+
      banner +
      '<div class="section-label">변경 대상</div><div class="target">'+esc(p.target)+'</div>'+
      '<div class="section-label">변경 전후</div>'+changeBlock(p)+ evidBlock(p)+
      '<div class="note">'+esc(p.note)+'</div>'+
      '<div class="dacts">'+acts+'<div class="snooze-menu" id="snoozeMenu"></div></div></div>';
  }

  function snoozeMenuHTML(){
    var t=addDays(TODAY,1), w=addDays(TODAY,2), n=addDays(TODAY,4);
    return '<div class="sm-h">언제 다시 볼까요?</div>'+
      '<button data-snooze="'+t.getTime()+'">내일 <span class="d">'+fmt(t)+' (일)</span></button>'+
      '<button data-snooze="'+w.getTime()+'">월요일 아침 <span class="d">'+fmt(w)+' (월)</span></button>'+
      '<button data-snooze="'+n.getTime()+'">수요일 <span class="d">'+fmt(n)+' (수)</span></button>'+
      '<div class="sm-date"><input type="date" id="snoozeDate" min="2026-10-18" value="2026-10-20"><button class="btn primary" data-act="snoozeCustom" style="height:34px">지정</button></div>';
  }

  var toastEl=document.getElementById("toast"), toastTimer;
  function toast(html){ toastEl.innerHTML=html; toastEl.classList.add("show"); clearTimeout(toastTimer); toastTimer=setTimeout(function(){toastEl.classList.remove("show");},3000); }

  function afterChange(nextMsg){
    var p=proposals.find(function(x){return x.id===selectedId;});
    if(!p || !inTab(p)){ var first=proposals.filter(inTab)[0]; selectedId=first?first.id:null; }
    renderTabs(); renderList(); renderDetail(); updateBatch();
    if(nextMsg) toast(nextMsg);
  }

  function doSnooze(ts){
    var p=proposals.find(function(x){return x.id===selectedId;});
    p.snoozedUntil=new Date(parseInt(ts,10)); delete picked[p.id];
    afterChange('<span class="u">미뤄둠</span> '+fmt(p.snoozedUntil)+'에 오늘 목록으로 다시 표시 · 근거 만료 전 검토하세요');
  }

  document.getElementById("list").addEventListener("click", function(e){
    var cb=e.target.closest(".rcheck");
    if(cb){ picked[cb.dataset.pick]=cb.checked; updateBatch(); e.stopPropagation(); return; }
    var card=e.target.closest(".rcard");
    if(card){ editing=false; selectedId=card.dataset.id; renderList(); renderDetail(); }
  });

  document.getElementById("detail").addEventListener("click", function(e){
    var b=e.target.closest("button[data-act], button[data-snooze], a.btn"); if(!b) return;
    var p=proposals.find(function(x){return x.id===selectedId;});

    if(b.dataset.snooze){ doSnooze(b.dataset.snooze); return; }
    var act=b.dataset.act;
    if(act==="snooze"){
      var m=document.getElementById("snoozeMenu");
      snoozeOpen=!snoozeOpen; m.classList.toggle("open",snoozeOpen);
      if(snoozeOpen) m.innerHTML=snoozeMenuHTML();
      return;
    }
    if(act==="snoozeCustom"){ var dv=document.getElementById("snoozeDate").value; if(dv){ var parts=dv.split("-"); doSnooze(new Date(+parts[0],parts[1]-1,+parts[2]).getTime()); } return; }
    if(act==="now"){ p.snoozedUntil=null; afterChange('다시 오늘 검토 목록으로 가져왔어요'); return; }
    if(act==="approve"){ p.status="approved"; delete picked[p.id]; afterChange('<span class="u">승인됨</span> 확정 상태에 반영 · 근거·전후 버전 기록'); return; }
    if(act==="reject"){ p.status="rejected"; delete picked[p.id]; afterChange('거절됨 · 같은 근거 재생성 시 목록에서 숨김'); return; }
    if(act==="edit"){ editing=true; renderDetail(); return; }
    if(act==="cancelEdit"){ editing=false; renderDetail(); return; }
    if(act==="saveEdit"){
      var v=document.getElementById("editInput").value;
      p.editedTo=v; if(!p.tasks){ p.diff[0].a=v; } p.status="approved"; editing=false;
      afterChange('<span class="u">수정 후 반영됨</span> 사용자 확정값으로 기록');
      return;
    }
    if(act==="recheck"){ // 충돌 재비교: 최신 상태가 이미 목표값과 같아짐 → 제안 불필요
      p.conflict=null; p.review="resolved";
      document.getElementById("detail").innerHTML =
        '<div class="detail-in"><div class="dhead"><span class="sev-dot '+p.sev+'"></span><h2>'+esc(p.title)+'</h2><span class="ptag">'+esc(p.project)+'</span></div>'+
        '<div class="banner ok"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M20 6 9 17l-5-5"/></svg><div><b>최신 상태를 다시 확인했어요.</b><br>현재 상태가 이미 <b>진행 중</b>으로 바뀌어, 이 제안은 더 이상 필요하지 않습니다.</div></div>'+
        '<div class="note">다른 기기에서 먼저 반영된 변경과 중복되므로 폐기를 권장합니다. 승인 효과는 1회만 적용됩니다.</div>'+
        '<div class="dacts"><button class="btn primary" data-act="reject">제안 폐기</button></div></div>';
      toast('최신 상태 재확인 완료 · 변경 불필요');
      return;
    }
    if(act==="find"){
      document.getElementById("detail").querySelector(".dacts").insertAdjacentHTML("beforebegin",
        '<div class="note" style="color:var(--crit-fg);border-color:color-mix(in srgb,var(--crit-fg) 30%,transparent)">연결 가능한 다른 근거를 찾지 못했습니다. 근거 없이 확정할 수 없으므로 폐기를 권장합니다.</div>');
      toast('대체 근거 없음 · 폐기 권장');
      return;
    }
  });

  function updateBatch(){
    var n=Object.keys(picked).filter(function(k){return picked[k];}).length;
    document.getElementById("selInfo").textContent="선택 "+n+"건";
    var btn=document.getElementById("batchBtn"); btn.disabled=n===0; btn.textContent=n>0?"선택 "+n+"건 승인":"선택 승인";
  }
  document.getElementById("batchBtn").addEventListener("click", function(){
    var ids=Object.keys(picked).filter(function(k){return picked[k];}); if(!ids.length) return;
    ids.forEach(function(id){ var p=proposals.find(function(x){return x.id===id;}); if(p){p.status="approved";} delete picked[id]; });
    selectedId=null; afterChange('<span class="u">'+ids.length+'건 승인됨</span> 항목별 결과 반영 · 상태/기한 변경은 제외');
  });
  document.getElementById("selAll").addEventListener("change", function(){
    var on=this.checked; proposals.forEach(function(p){ if(selectable(p)) picked[p.id]=on; });
    renderList(); updateBatch();
  });

  document.getElementById("tabs").addEventListener("click", function(e){
    var b=e.target.closest("button"); if(!b) return;
    this.querySelectorAll("button").forEach(function(x){x.classList.remove("on");});
    b.classList.add("on"); tab=b.dataset.t; editing=false;
    var first=proposals.filter(inTab)[0]; selectedId=first?first.id:null;
    renderList(); renderDetail();
  });

  var root=document.documentElement;
  document.getElementById("themeBtn").addEventListener("click", function(){
    var cur=root.getAttribute("data-theme"); if(!cur) cur=window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";
    root.setAttribute("data-theme", cur==="dark"?"light":"dark");
  });

  renderTabs(); renderList(); renderDetail(); updateBatch();
</script>
