  :root{
    --canvas:#ffffff; --surface:#f5f8fb; --card:#ffffff; --card-2:#fbfdfe;
    --border:#e3e8ee; --border-strong:#cfd8e2; --ink:#0e1726; --body:#17253d; --muted:#5c6b7c;
    --primary:#0078d4; --primary-hover:#106ebe; --on-primary:#ffffff; --link:#0067b8;
    --dark-action:#091f2c; --pill-active:#06161f;
    --good-fg:#0f7a43; --warn-fg:#935600; --crit-fg:#b02a1f; --info-fg:#0067b8;
    --g-purple:linear-gradient(135deg,#8b7bf2,#b9a7ff); --g-green:linear-gradient(135deg,#15c08a,#78e7c3);
    --glass-front:linear-gradient(135deg,rgba(255,255,255,.60),rgba(255,255,255,.14)); --glass-border:rgba(255,255,255,.7); --glass-ink:#1b2435;
    --shadow-sm:0 1px 2px rgba(14,23,38,.08),0 1px 1px rgba(14,23,38,.05);
    --shadow-md:0 2px 10px rgba(14,23,38,.10),0 1px 3px rgba(14,23,38,.06);
    --shadow-lg:0 12px 32px rgba(14,23,38,.14),0 4px 10px rgba(14,23,38,.08);
    --s-xs:4px; --s-sm:8px; --s-md:12px; --s-base:16px; --s-lg:24px; --s-xl:32px;
    --r-sm:2px; --r-md:4px; --r-lg:8px; --r-xl:14px; --r-xxl:24px; --r-pill:200px;
    --font:"Pretendard","Pretendard Variable",system-ui,-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    --font-display:"Pretendard","Pretendard Variable",system-ui,-apple-system,"Malgun Gothic",sans-serif;
    --font-hand:"HandAccent","Pretendard",cursive;
  }
  @media (prefers-color-scheme:dark){
    :root{ --canvas:#0b1117; --surface:#0f1620; --card:#141d27; --card-2:#17212c;
      --border:#243240; --border-strong:#31424f; --ink:#eef4fa; --body:#c3d0dc; --muted:#8ea0b2;
      --primary:#3aa0f0; --primary-hover:#58b0f4; --on-primary:#06131d; --link:#6bb8f6;
      --dark-action:#0a1a24; --pill-active:#eaf2f9; --good-fg:#55d393; --warn-fg:#e6a84a; --crit-fg:#f08478; --info-fg:#6bb8f6;
      --glass-front:linear-gradient(135deg,rgba(255,255,255,.22),rgba(255,255,255,.05)); --glass-border:rgba(255,255,255,.28); --glass-ink:#f3f7fb;
      --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow-md:0 2px 10px rgba(0,0,0,.45); --shadow-lg:0 14px 36px rgba(0,0,0,.55); }
  }
  :root[data-theme="light"]{ --canvas:#ffffff; --surface:#f5f8fb; --card:#ffffff; --card-2:#fbfdfe;
    --border:#e3e8ee; --border-strong:#cfd8e2; --ink:#0e1726; --body:#17253d; --muted:#5c6b7c;
    --primary:#0078d4; --primary-hover:#106ebe; --on-primary:#ffffff; --link:#0067b8; --dark-action:#091f2c; --pill-active:#06161f;
    --good-fg:#0f7a43; --warn-fg:#935600; --crit-fg:#b02a1f; --info-fg:#0067b8;
    --glass-front:linear-gradient(135deg,rgba(255,255,255,.60),rgba(255,255,255,.14)); --glass-border:rgba(255,255,255,.7); --glass-ink:#1b2435;

    --border:#243240; --border-strong:#31424f; --ink:#eef4fa; --body:#c3d0dc; --muted:#8ea0b2;
    --primary:#3aa0f0; --primary-hover:#58b0f4; --on-primary:#06131d; --link:#6bb8f6; --dark-action:#0a1a24; --pill-active:#eaf2f9;

  *{box-sizing:border-box;}
  body{margin:0;background:var(--surface);color:var(--body);font-family:var(--font);font-size:17px;line-height:1.5;letter-spacing:-.1px;-webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:var(--font-display);color:var(--ink);margin:0;text-wrap:balance;}
  a{color:var(--link);text-decoration:none;} button{font-family:inherit;cursor:pointer;} input{font-family:inherit;}
  .num{font-variant-numeric:tabular-nums;}
  .hand{font-family:var(--font-hand);font-weight:400;letter-spacing:0;}
  :focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:var(--r-md);}

  .app{display:grid;grid-template-columns:240px 1fr;grid-template-rows:56px 1fr;grid-template-areas:"rail topbar" "rail main";height:100vh;}
  .topbar{grid-area:topbar;display:flex;align-items:center;gap:var(--s-base);padding:0 var(--s-lg);background:var(--card);border-bottom:1px solid var(--border);}
  .search{flex:1;max-width:520px;display:flex;align-items:center;gap:var(--s-sm);height:34px;padding:0 var(--s-md);background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);color:var(--muted);font-size:15px;}
  .search input{border:0;background:transparent;outline:none;color:var(--body);font:inherit;font-size:15px;width:100%;}
  .cost-chip{display:flex;align-items:center;gap:var(--s-sm);height:32px;padding:0 var(--s-md);border-radius:var(--r-pill);background:color-mix(in srgb,var(--warn-fg) 14%,transparent);color:var(--warn-fg);font-size:14px;font-weight:600;white-space:nowrap;}
  .icon-btn{width:34px;height:34px;display:grid;place-items:center;border:1px solid transparent;border-radius:var(--r-md);background:transparent;color:var(--muted);}
  .icon-btn:hover{background:var(--surface);color:var(--ink);}
  .avatar{width:32px;height:32px;border-radius:50%;background:var(--g-purple);display:grid;place-items:center;color:#fff;font-size:14px;font-weight:700;}

  .rail{grid-area:rail;background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:var(--s-md);gap:var(--s-xs);overflow:hidden;}
  .brand{display:flex;align-items:center;gap:var(--s-md);padding:var(--s-sm) var(--s-sm) var(--s-base);}
  .brand .logo{width:34px;height:34px;border-radius:var(--r-lg);position:relative;flex:none;}
  .brand .logo .plate{position:absolute;inset:4px -4px -4px 4px;border-radius:var(--r-lg);background:var(--g-green);opacity:.9;}
  .brand .logo .glass{position:absolute;inset:0;border-radius:var(--r-lg);background:var(--glass-front);border:1px solid var(--glass-border);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center;font-size:19px;box-shadow:inset 0 1px 0 rgba(255,255,255,.6);}
  .brand .name{font-family:var(--font-display);font-weight:700;font-size:20px;color:var(--ink);letter-spacing:-.4px;}
  .brand .tag{font-family:var(--font-hand);font-size:21px;color:var(--muted);line-height:1;margin-top:2px;}
  .nav-item{display:flex;align-items:center;gap:var(--s-md);height:40px;padding:0 var(--s-md);border-radius:var(--r-md);color:var(--body);font-size:15px;font-weight:500;border:0;background:transparent;width:100%;text-align:left;}
  .nav-item svg{color:var(--muted);flex:none;}
  .nav-item:hover{background:var(--surface);}
  .nav-item.active{background:color-mix(in srgb,var(--primary) 12%,transparent);color:var(--ink);font-weight:600;}
  .nav-item.active svg{color:var(--primary);}
  .nav-item .badge{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:var(--r-pill);background:var(--crit-fg);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;}
  .nav-sep{height:1px;background:var(--border);margin:var(--s-sm);}
  .rail-foot{margin-top:auto;padding:var(--s-sm);font-size:12px;color:var(--muted);line-height:1.4;}

  .main{grid-area:main;overflow-y:auto;padding:var(--s-lg) var(--s-xl) var(--s-xl);}
  .crumb{font-size:13px;color:var(--muted);margin-bottom:var(--s-sm);}
  .rec-head{display:flex;align-items:center;gap:var(--s-md);flex-wrap:wrap;margin-bottom:var(--s-base);}
  .rec-head h1{font-size:30px;font-weight:600;letter-spacing:-.6px;}
  .src-badge{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--body);background:var(--surface);border:1px solid var(--border);padding:5px 12px;border-radius:var(--r-pill);}
  .chip{font-size:13px;font-weight:600;padding:5px 12px;border-radius:var(--r-pill);}
  .chip.work{color:var(--info-fg);background:color-mix(in srgb,var(--info-fg) 12%,transparent);}
  .chip.proj{color:var(--body);background:var(--surface);border:1px solid var(--border);}
  .head-sp{flex:1;}
  .btn{height:36px;padding:0 var(--s-base);border-radius:var(--r-md);font-size:14px;font-weight:600;border:1px solid var(--border-strong);background:var(--card);color:var(--body);display:inline-flex;align-items:center;gap:7px;}
  .btn:hover{background:var(--surface);}

<script>
  "use strict";
  var toastEl=document.getElementById("toast"), tt;
  function toast(h){ toastEl.innerHTML=h; toastEl.classList.add("show"); clearTimeout(tt); tt=setTimeout(function(){toastEl.classList.remove("show");},2800); }
  function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  (function(){
    var root=document.documentElement, b=document.getElementById("themeBtn"); if(!b) return;
    b.addEventListener("click", function(){
      var cur=root.getAttribute("data-theme"); if(!cur) cur=window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";
      root.setAttribute("data-theme", cur==="dark"?"light":"dark");
    });
  })();


  // 오늘 10/17 기준 목업 데이터. 확정 자료와 초안은 분리해서 보여 준다(FR-13)
  var docs=[
    {type:"meeting",title:"주간회의 — 회의록 초안",proj:"자동차 사고접수 개편",days:1,state:"draft",text:"이번 주 안에 접수 화면 개선안 확정하고 현업 리뷰 시작. 자동판독 요건서는 금요일까지 미루고 범위부터 잡기로 함. 개발 공수는 박지훈이 10/22까지 다시 산정.",src:"🎙️ 녹음 10/16 · 검토 전 초안"},
    {type:"task",title:"화면 개발 일정표 공유",proj:"자동차 사고접수 개편",days:3,state:"approved",text:"기한 10/21 · 팔로업 박지훈 · 개발 공수 확정 후 공유",src:"할 일 · AI 제안 승인(IT 개발팀 통화 10/14)"},
    {type:"transcript",title:"IT 개발팀 통화 — 전사",proj:"자동차 사고접수 개편",days:3,state:"approved",text:"접수 화면은 두 가지 안으로 가고, 개발 공수는 다음 주에 다시 보기로 했어요.",src:"📞 통화 파일 10/14 · 내 수정본"},
    {type:"meeting",title:"킥오프 회의 — 회의록",proj:"자동차 사고접수 개편",days:37,state:"approved",text:"개편 범위: 사고접수, 서류 제출, 진행 조회 3종. 자동판독은 11월.",src:"🎙️ 녹음 9/10",expired:true},
    {type:"meeting",title:"챗봇 시나리오 미팅 — 회의록 초안",proj:"보상 안내 챗봇 오픈",days:0,state:"draft",text:"답변 시나리오 후보 두 안, 오픈 일정은 아직 미정.",src:"🎙️ 녹음 10/17 · 검토 전 초안"}
  ];
  var type="";
  var TYPE_NAME={meeting:"회의록",task:"할 일",transcript:"전사"};
  function highlight(text,q){
    if(!q) return esc(text);
    var out="", lower=text.toLowerCase(), ql=q.toLowerCase(), i=0, j;
    while((j=lower.indexOf(ql,i))>=0){ out+=esc(text.slice(i,j))+"<mark>"+esc(text.slice(j,j+q.length))+"</mark>"; i=j+q.length; }
    return out+esc(text.slice(i));
  }
  function card(d,q){
    return '<div class="res"><div class="top"><span class="chip info">'+TYPE_NAME[d.type]+'</span><a class="ttl" href="workbrain-record-detail.html">'+highlight(d.title,q)+'</a>'+
      (d.state==="draft"?'<span class="chip warn">초안</span>':'')+'</div>'+
      '<p class="snip">'+highlight(d.text,q)+'</p>'+
      '<div class="meta"><span>📁 '+esc(d.proj)+'</span><span>·</span><span>'+esc(d.src)+'</span>'+
      (d.expired?'<span class="chip mute" title="보관 기간이 지나 원본 음성은 삭제됨. 승인된 회의록은 유지">원본 음성 만료</span>':'')+'</div></div>';
  }
  function run(){
    var q=document.getElementById("q").value.trim(), pj=document.getElementById("fProj").value, period=document.getElementById("fPeriod").value;
    var showDraft=document.getElementById("fDraft").checked;
    var hit=docs.filter(function(d){
      var inText=!q || (d.title+" "+d.text).toLowerCase().indexOf(q.toLowerCase())>=0;
      return inText && (!pj||d.proj===pj) && (period==="all"||d.days<=+period) && (!type||d.type===type);
    });
    var fixed=hit.filter(function(d){return d.state!=="draft";}), drafts=hit.filter(function(d){return d.state==="draft";});
    var el=document.getElementById("results");
    if(!fixed.length && !(showDraft&&drafts.length)){
      el.innerHTML='<div class="card"><div class="empty"><b>찾는 결과가 없어요</b>'+
        (period!=="all"?'<button class="btn" data-relax="period" style="margin:8px 4px 0">기간을 전체로 넓히기</button>':'')+
        (pj?'<button class="btn" data-relax="proj" style="margin:8px 4px 0">모든 프로젝트에서 찾기</button>':'')+
        (!showDraft&&drafts.length?'<button class="btn" data-relax="draft" style="margin:8px 4px 0">초안 '+drafts.length+'건도 보기</button>':'')+'</div></div>';
      return;
    }
    el.innerHTML = '<div class="res-head">확정된 자료 <b>'+fixed.length+'</b>건'+(!showDraft&&drafts.length?' · 초안 '+drafts.length+'건은 숨김':'')+'</div>'+
      '<div class="card">'+(fixed.map(function(d){return card(d,q);}).join("")||'<div class="empty">확정된 자료 중엔 없어요</div>')+'</div>'+
      (showDraft&&drafts.length?'<div class="draft-sec"><div class="res-head">검토 전 초안 <b>'+drafts.length+'</b>건 · 아직 확정 사실이 아니에요</div><div class="card">'+drafts.map(function(d){return card(d,q);}).join("")+'</div></div>':'');
  }
  document.getElementById("results").addEventListener("click", function(e){
    var r=e.target.dataset.relax; if(!r) return;
    if(r==="period") document.getElementById("fPeriod").value="all";
    if(r==="proj") document.getElementById("fProj").value="";
    if(r==="draft") document.getElementById("fDraft").checked=true;
    run();
  });
  document.getElementById("fType").addEventListener("click", function(e){
    var b=e.target.closest("button"); if(!b) return;
    this.querySelectorAll("button").forEach(function(x){x.classList.remove("on");}); b.classList.add("on"); type=b.dataset.t; run();
  });
  ["fProj","fPeriod","fDraft"].forEach(function(id){ document.getElementById(id).addEventListener("change", run); });
  document.getElementById("go").addEventListener("click", run);
  document.getElementById("q").addEventListener("keydown", function(e){ if(e.key==="Enter") run(); });
  var qs=new URLSearchParams(location.search).get("q"); document.getElementById("q").value = qs!==null ? qs : "공수";
  run();

</script>
