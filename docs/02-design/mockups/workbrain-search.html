  }
  function card(d,q){
    return '<div class="res"><div class="top"><span class="chip info">'+TYPE_NAME[d.type]+'</span><a class="ttl" href="workbrain-record-detail.html">'+highlight(d.title,q)+'</a>'+
      (d.state==="draft"?'<span class="chip warn">초안</span>':'')+'</div>'+
      '<p class="snip">'+highlight(d.text,q)+'</p>'+
      '<div class="meta"><span>📁 '+esc(d.proj)+'</span><span>·</span><span>'+esc(d.src)+'</span>'+
      (d.expired?'<span class="chip mute" title="보관 기간이 지나 원본 음성은 삭제됨. 승인된 회의록은 유지">원본 음성 만료</span>':'')+'</div></div>';
  }
  function run(){
    var q=document.getElementById("q").value.trim(), pj=document.getElementById("fProj").value, period=document.getElementById("fPeriod").value;
    var showDraft=document.getElementById("fDraft").checked;
    var hit=docs.filter(function(d){
      var inText=!q || (d.title+" "+d.text).toLowerCase().indexOf(q.toLowerCase())>=0;
      return inText && (!pj||d.proj===pj) && (period==="all"||d.days<=+period) && (!type||d.type===type);
    });
    var fixed=hit.filter(function(d){return d.state!=="draft";}), drafts=hit.filter(function(d){return d.state==="draft";});
    var el=document.getElementById("results");
    if(!fixed.length && !(showDraft&&drafts.length)){
      el.innerHTML='<div class="card"><div class="empty"><b>찾는 결과가 없어요</b>'+
        (period!=="all"?'<button class="btn" data-relax="period" style="margin:8px 4px 0">기간을 전체로 넓히기</button>':'')+
        (pj?'<button class="btn" data-relax="proj" style="margin:8px 4px 0">모든 프로젝트에서 찾기</button>':'')+
        (!showDraft&&drafts.length?'<button class="btn" data-relax="draft" style="margin:8px 4px 0">초안 '+drafts.length+'건도 보기</button>':'')+'</div></div>';
      return;
    }
    el.innerHTML = '<div class="res-head">확정된 자료 <b>'+fixed.length+'</b>건'+(!showDraft&&drafts.length?' · 초안 '+drafts.length+'건은 숨김':'')+'</div>'+
      '<div class="card">'+(fixed.map(function(d){return card(d,q);}).join("")||'<div class="empty">확정된 자료 중엔 없어요</div>')+'</div>'+
      (showDraft&&drafts.length?'<div class="draft-sec"><div class="res-head">검토 전 초안 <b>'+drafts.length+'</b>건 · 아직 확정 사실이 아니에요</div><div class="card">'+drafts.map(function(d){return card(d,q);}).join("")+'</div></div>':'');
  }
  document.getElementById("results").addEventListener("click", function(e){
    var r=e.target.dataset.relax; if(!r) return;
    if(r==="period") document.getElementById("fPeriod").value="all";
    if(r==="proj") document.getElementById("fProj").value="";
    if(r==="draft") document.getElementById("fDraft").checked=true;
    run();
  });
  document.getElementById("fType").addEventListener("click", function(e){
    var b=e.target.closest("button"); if(!b) return;
    this.querySelectorAll("button").forEach(function(x){x.classList.remove("on");}); b.classList.add("on"); type=b.dataset.t; run();
  });
  ["fProj","fPeriod","fDraft"].forEach(function(id){ document.getElementById(id).addEventListener("change", run); });
  document.getElementById("go").addEventListener("click", run);
  document.getElementById("q").addEventListener("keydown", function(e){ if(e.key==="Enter") run(); });
  var qs=new URLSearchParams(location.search).get("q"); document.getElementById("q").value = qs!==null ? qs : "촬영";
  run();

</script>
