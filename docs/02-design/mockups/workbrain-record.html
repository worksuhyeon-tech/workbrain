  :root{
    --canvas:#ffffff; --surface:#f5f8fb; --card:#ffffff; --card-2:#fbfdfe;
    --border:#e3e8ee; --border-strong:#cfd8e2; --ink:#0e1726; --body:#17253d; --muted:#5c6b7c;
    --primary:#0078d4; --primary-hover:#106ebe; --on-primary:#ffffff; --link:#0067b8;
    --dark-action:#091f2c; --pill-active:#06161f;
    --good-fg:#0f7a43; --warn-fg:#935600; --crit-fg:#b02a1f; --info-fg:#0067b8; --rec:#e8443b;
    --g-purple:linear-gradient(135deg,#8b7bf2,#b9a7ff); --g-orange:linear-gradient(135deg,#ff8a3d,#ffc08a);
    --g-pink:linear-gradient(135deg,#ff4d8d,#ff95ba); --g-green:linear-gradient(135deg,#15c08a,#78e7c3);
    --hero-bg:linear-gradient(160deg,#eaf3fb 0%,#eef0fb 55%,#f6ecf4 100%);
    --glass-front:linear-gradient(135deg,rgba(255,255,255,.60),rgba(255,255,255,.14));
    --glass-border:rgba(255,255,255,.7); --glass-ink:#1b2435;
    --bezel:#0c1620; --bezel-edge:#243240;
    --shadow-sm:0 1px 2px rgba(14,23,38,.08),0 1px 1px rgba(14,23,38,.05);
    --shadow-md:0 2px 10px rgba(14,23,38,.10),0 1px 3px rgba(14,23,38,.06);
    --shadow-lg:0 18px 44px rgba(14,23,38,.16),0 6px 14px rgba(14,23,38,.08);
    --s-xs:4px; --s-sm:8px; --s-md:12px; --s-base:16px; --s-lg:24px; --s-xl:32px;
    --r-sm:2px; --r-md:4px; --r-lg:8px; --r-xl:14px; --r-xxl:24px; --r-pill:200px;
    --font:"Pretendard","Pretendard Variable",system-ui,-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    --font-display:"Pretendard","Pretendard Variable",system-ui,-apple-system,"Malgun Gothic",sans-serif;
    --font-hand:"HandAccent","Pretendard",cursive;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --canvas:#0b1117; --surface:#0f1620; --card:#141d27; --card-2:#17212c;
      --border:#243240; --border-strong:#31424f; --ink:#eef4fa; --body:#c3d0dc; --muted:#8ea0b2;
      --primary:#3aa0f0; --primary-hover:#58b0f4; --on-primary:#06131d; --link:#6bb8f6;
      --good-fg:#55d393; --warn-fg:#e6a84a; --crit-fg:#f08478; --info-fg:#6bb8f6; --rec:#ff6a60;
      --hero-bg:linear-gradient(160deg,#0e1a24 0%,#121a2b 55%,#1b1526 100%);
      --glass-front:linear-gradient(135deg,rgba(255,255,255,.20),rgba(255,255,255,.04));
      --glass-border:rgba(255,255,255,.26); --glass-ink:#f3f7fb; --bezel:#05090d; --bezel-edge:#1b2733;
      --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow-md:0 2px 10px rgba(0,0,0,.45); --shadow-lg:0 18px 44px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="light"]{
    --canvas:#ffffff; --surface:#f5f8fb; --card:#ffffff; --card-2:#fbfdfe;
    --border:#e3e8ee; --border-strong:#cfd8e2; --ink:#0e1726; --body:#17253d; --muted:#5c6b7c;
    --primary:#0078d4; --primary-hover:#106ebe; --on-primary:#ffffff; --link:#0067b8;
    --good-fg:#0f7a43; --warn-fg:#935600; --crit-fg:#b02a1f; --info-fg:#0067b8; --rec:#e8443b;
    --hero-bg:linear-gradient(160deg,#eaf3fb 0%,#eef0fb 55%,#f6ecf4 100%);
    --glass-front:linear-gradient(135deg,rgba(255,255,255,.60),rgba(255,255,255,.14));
    --glass-border:rgba(255,255,255,.7); --glass-ink:#1b2435; --bezel:#0c1620; --bezel-edge:#243240;
    --shadow-sm:0 1px 2px rgba(14,23,38,.08),0 1px 1px rgba(14,23,38,.05);
    --shadow-md:0 2px 10px rgba(14,23,38,.10),0 1px 3px rgba(14,23,38,.06);
    --shadow-lg:0 18px 44px rgba(14,23,38,.16),0 6px 14px rgba(14,23,38,.08);
  }
  :root[data-theme="dark"]{
    --canvas:#0b1117; --surface:#0f1620; --card:#141d27; --card-2:#17212c;
    --border:#243240; --border-strong:#31424f; --ink:#eef4fa; --body:#c3d0dc; --muted:#8ea0b2;

  *{box-sizing:border-box;}
  body{margin:0;background:var(--hero-bg);color:var(--body);font-family:var(--font);
    font-size:17px;line-height:1.5;letter-spacing:-.1px;-webkit-font-smoothing:antialiased;min-height:100vh;}
  h1,h2,h3{font-family:var(--font-display);color:var(--ink);margin:0;}
  button{font-family:inherit;cursor:pointer;} input{font-family:inherit;}
  .num{font-variant-numeric:tabular-nums;}
  .hand{font-family:var(--font-hand);font-weight:400;letter-spacing:0;}
  :focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:var(--r-md);}

  .ctl{display:flex;align-items:center;justify-content:center;gap:var(--s-md);flex-wrap:wrap;padding:var(--s-lg) var(--s-base) 0;}
  .seg{display:flex;gap:3px;background:var(--card);border:1px solid var(--border);padding:3px;border-radius:var(--r-pill);box-shadow:var(--shadow-sm);}
  .seg button{height:34px;padding:0 var(--s-base);border:0;border-radius:var(--r-pill);background:transparent;color:var(--muted);font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px;}
  .seg button.on{background:var(--pill-active);color:#fff;}
  :root[data-theme="dark"] .seg button.on{color:#06131d;}
  .statesel{height:40px;padding:0 var(--s-md);border:1px solid var(--border);border-radius:var(--r-md);background:var(--card);color:var(--body);font-size:14px;font-weight:600;box-shadow:var(--shadow-sm);}

<script>
  "use strict";
  var toastEl=document.getElementById("toast"), tt;
  function toast(h){ toastEl.innerHTML=h; toastEl.classList.add("show"); clearTimeout(tt); tt=setTimeout(function(){toastEl.classList.remove("show");},2600); }

  var wave=document.getElementById("wave");
  for(var i=0;i<20;i++){ var s=document.createElement("span"); s.style.animationDelay=(i*0.07)+"s"; wave.appendChild(s); }

  // ===== 상태 =====
  var elapsed=12, saved=10, recording=true, timerInt=null;
  var attendees=[{name:"나", me:true},{name:"김하늘"}];
  var bookmarks=[];
  function mmss(t){ var m=Math.floor(t/60), s=t%60; return (m<10?"0":"")+m+":"+(s<10?"0":"")+s; }
  function tick(){ elapsed++; saved=Math.max(0,elapsed-2); renderTimer(); }
  function startTimer(){ clearInterval(timerInt); if(recording) timerInt=setInterval(tick,1000); }
  function esc(s){return String(s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}

  function renderTimer(){
    document.getElementById("timer").textContent=mmss(elapsed);
    document.getElementById("segSaved").textContent="확정 저장 "+mmss(saved)+"까지 · 손실 0";
  }

  // 참석자: 상단 아바타 + 우측 목록
  function renderAttendees(){
    var top=document.getElementById("attTop");
    top.innerHTML = attendees.map(function(a,i){ return '<span class="av g'+(i%4)+'" title="'+esc(a.name)+'">'+esc(a.name[0])+'</span>'; }).join("")
      + '<button class="att-add" id="attAddTop">+ 참석자</button>'
      + '<span class="att-inline" id="attInline"><input id="attInputTop" type="text" placeholder="이름" maxlength="20"></span>';
    document.getElementById("attCnt").textContent = attendees.length+"명";
    var list=document.getElementById("attList");
    list.innerHTML = attendees.map(function(a,i){
      return '<div class="att-chip"><span class="av g'+(i%4)+'" style="margin:0">'+esc(a.name[0])+'</span><span class="nm">'+esc(a.name)+(a.me?' <span class="me">나</span>':'')+'</span>'+
        (a.me?'':'<button class="rm" data-rm="'+i+'" aria-label="삭제"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button>')+'</div>';
    }).join("");
  }
  function addAttendee(name){
    name=(name||"").trim(); if(!name) return;
    if(attendees.some(function(a){return a.name===name;})){ toast('이미 추가된 참석자예요'); return; }
    attendees.push({name:name}); renderAttendees(); toast('<span class="u">참석자 추가</span> '+esc(name));
  }

  // 컨트롤
  var controls=document.getElementById("recControls");
  function renderControls(){
    var dot=document.getElementById("recDot"), st=document.getElementById("recState"), rh=document.getElementById("recHand");
    dot.className="dot"+(recording?"":" paused");
    st.textContent=recording?"녹음 중":"일시중지됨";
    rh.textContent=recording?"녹음 중이에요":"잠깐 멈췄어요";
    rh.style.color = recording ? "var(--rec)" : "var(--muted)";
    wave.className="wave"+(recording?"":" paused-wave");
    controls.innerHTML = recording
      ? '<div class="rctl-item"><button class="rbtn" data-act="pause" aria-label="일시중지"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button><span class="rbtn-label">일시중지</span></div>'
        + '<div class="rctl-item"><button class="rbtn stop" data-act="stop" aria-label="정지"><svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg></button><span class="rbtn-label">정지·업로드</span></div>'
      : '<div class="rctl-item"><button class="rbtn" data-act="resume" aria-label="재개"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button><span class="rbtn-label">재개</span></div>'
        + '<div class="rctl-item"><button class="rbtn stop" data-act="stop" aria-label="정지"><svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg></button><span class="rbtn-label">정지·업로드</span></div>';
  }
  controls.addEventListener("click", function(e){
    var b=e.target.closest("button[data-act]"); if(!b) return; var a=b.dataset.act;
    if(a==="pause"){ recording=false; clearInterval(timerInt); renderControls(); toast('일시중지 · '+mmss(saved)+'까지 안전하게 저장됨'); }
    else if(a==="resume"){ recording=true; renderControls(); startTimer(); toast('녹음 재개'); }
    else if(a==="stop"){ clearInterval(timerInt); recording=false; renderControls();
      toast('<span class="u">녹음 종료</span> "'+esc(document.getElementById("titleInput").value||"제목 없는 녹음")+'" '+mmss(elapsed)+' · 업로드 동의·예상 비용 확인 → 전사'); }
  });

  // 제목 (클로바노트식 — 녹음 중에도 수정)
  var titleInput=document.getElementById("titleInput");
  document.getElementById("penBtn").addEventListener("click", function(){ titleInput.focus(); titleInput.select(); });
  titleInput.addEventListener("keydown", function(e){ if(e.key==="Enter"){ this.blur(); } });
  titleInput.addEventListener("change", function(){ if(!this.value.trim()) this.value="제목 없는 녹음"; toast('제목 저장 · "'+esc(this.value)+'"'); });

  // 참석자 입력 (우측 패널 + 상단 인라인)
  document.getElementById("attAdd").addEventListener("click", function(){ var el=document.getElementById("attInput"); addAttendee(el.value); el.value=""; el.focus(); });
  document.getElementById("attInput").addEventListener("keydown", function(e){ if(e.key==="Enter"){ addAttendee(this.value); this.value=""; } });
  document.getElementById("attTop").addEventListener("click", function(e){
    if(e.target.closest("#attAddTop")){
      var inl=document.getElementById("attInline"); inl.classList.toggle("open");
      if(inl.classList.contains("open")) document.getElementById("attInputTop").focus();
    }
  });
  document.getElementById("attTop").addEventListener("keydown", function(e){
    if(e.target.id==="attInputTop" && e.key==="Enter"){ addAttendee(e.target.value); e.target.value=""; }
  });
  document.getElementById("attList").addEventListener("click", function(e){
    var b=e.target.closest("button[data-rm]"); if(!b) return;
    attendees.splice(parseInt(b.dataset.rm,10),1); renderAttendees();
  });

  // 북마크
  document.querySelector(".side").addEventListener("click", function(e){
    var b=e.target.closest("button[data-act]"); if(!b) return; var a=b.dataset.act;
    if(a==="bookmark"){
      bookmarks.push(mmss(elapsed));
      var list=document.getElementById("bmList");
      list.innerHTML = bookmarks.map(function(t,i){ return '<div class="bm"><span class="t num">'+t+'</span> 북마크 '+(i+1)+'</div>'; }).join("");
      toast('<span class="u">북마크</span> '+mmss(elapsed)+' 지점 표시');
    } else if(a==="pick"){ toast('파일 선택 — 손상·지원 외 형식 안내, 중복 감지'); }
    else if(a==="share"){ toast('공유 받기 — 통화 파일을 공유 시트에서 WorkBrain으로'); }
  });

  // 접힘/펼침 (상태 유지)
  document.getElementById("foldSeg").addEventListener("click", function(e){
    var b=e.target.closest("button"); if(!b) return;
    this.querySelectorAll("button").forEach(function(x){x.classList.remove("on");});
    b.classList.add("on");
    document.getElementById("device").className="device "+b.dataset.fold;
    toast(b.dataset.fold==="unfolded" ? '펼침 — 녹음은 계속, 우측에서 참석자·북마크를 편하게' : '접힘 — 한 손 녹음 화면 (상태 유지)');
  });

  // 상황 배너
  var banners={ normal:"",
    perm:'<div class="banner perm"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M4 10l16 12M5 11a7 7 0 0 0 11 5"/></svg><div><b>마이크 권한이 필요해요.</b> 허용해야 녹음을 시작할 수 있어요. <button class="mini">권한 허용</button></div></div>',
    space:'<div class="banner space"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg><div><b>저장 공간이 부족해요.</b> 확정 저장된 구간은 안전합니다. 공간 확보 후 이어서 녹음할 수 있어요.</div></div>',
    recover:'<div class="banner recover"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg><div><b>지난 녹음이 중단됐어요.</b> 00:10까지 저장돼 있어요. 이어서 복구할까요? <button class="mini">이어서 복구</button></div></div>'
  };
  document.getElementById("stateSel").addEventListener("change", function(){
    document.getElementById("banner").innerHTML=banners[this.value]||"";
    if(this.value==="perm"){ recording=false; clearInterval(timerInt); renderControls(); }
  });
  document.getElementById("banner").addEventListener("click", function(e){
    if(e.target.closest(".mini")){ document.getElementById("stateSel").value="normal"; this.innerHTML=""; recording=true; renderControls(); startTimer(); toast('이어서 녹음 · 저장 구간부터 복구'); }
  });
  document.querySelector(".import-mini").addEventListener("click", function(){ toast('파일 가져오기 — 손상·지원 외 형식 안내, 중복 감지'); });

  var root=document.documentElement;
  document.getElementById("themeBtn").addEventListener("click", function(){
    var cur=root.getAttribute("data-theme"); if(!cur) cur=window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";
    root.setAttribute("data-theme", cur==="dark"?"light":"dark");
  });

  renderAttendees(); renderControls(); renderTimer(); startTimer();
</script>
