# Android APK 빌드 (PC에 Android 도구를 설치하지 않고 GitHub에서 만든다)
# 결과: Actions 실행 화면 아래 'Artifacts'의 workbrain-apk(14일 보관)
# 고정 서명 열쇠(비밀값 ANDROID_KEYSTORE_B64·ANDROID_KEYSTORE_PASSWORD)가 있으면 그 열쇠로 서명한다.
# 열쇠가 매번 같아야 휴대폰에서 지우지 않고 '업데이트' 설치가 돼 녹음이 남는다.
name: android-apk

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: 서명 열쇠 준비
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/workbrain.jks"
            echo "WB_KEYSTORE_FILE=$RUNNER_TEMP/workbrain.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::고정 서명 열쇠가 없어 임시 열쇠로 서명합니다(다음 빌드를 업데이트로 설치할 수 없음)"
          fi
      - name: APK 빌드
        env:
          WB_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          gradle -p android assembleDebug --no-daemon --console=plain 2>&1 | tee build.log
          exit "${PIPESTATUS[0]}"
      # 공개 저장소의 로그 본문은 로그인해야 보이므로, 컴파일 오류만 공개 주석으로 남겨 바로 읽을 수 있게 한다
      - name: 빌드 오류 요약
        if: failure()
        run: |
          { grep -E "^e: " build.log; grep -E "What went wrong" -A 3 build.log; } | head -10 | while IFS= read -r line; do echo "::error::${line}"; done
      - uses: actions/upload-artifact@v4
        with:
          name: workbrain-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
      - name: 열쇠 파일 정리
        if: always()
        run: rm -f "$RUNNER_TEMP/workbrain.jks"
